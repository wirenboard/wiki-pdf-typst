name: Update Wiki PDFs

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  push:
    branches: [master]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'batch_generate.py'
      - 'audit_pdfs.py'
      - 'wiki_add_template.py'
      # Queue selection and upload logic cannot change a single byte of any
      # PDF, so a change here must not force a full regeneration.
      - 'wiki_publish.py'
      - 'lib/wiki_api.py'
  workflow_dispatch:  # Manual trigger

# One run at a time. Four merges in as many minutes started four --force runs at
# once, and they collided on the wiki: "Could not acquire lock" and duplicate
# archive paths, three red runs out of four. Worse, each had read the stored
# hashes before any of them uploaded, so the older-code runs overwrote what the
# newest one had already published.
#
# cancel-in-progress stays false on purpose: a force run takes ~15 minutes and
# the schedule ticks every 10, so cancelling would mean a full regeneration
# never finishes. Queued instead — GitHub keeps only the newest pending run, so
# a burst of merges collapses to the latest code.
concurrency:
  group: update-pdfs
  cancel-in-progress: false

jobs:
  update-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Typst
        run: |
          curl -sL https://github.com/typst/typst/releases/download/v0.13.1/typst-x86_64-unknown-linux-musl.tar.xz | tar xJ
          mkdir -p bin output
          mv typst-x86_64-unknown-linux-musl/typst bin/typst
          chmod +x bin/typst

      - name: Update PDFs
        env:
          WIKI_BOT_USER: ${{ secrets.WIKI_BOT_USER }}
          WIKI_BOT_PASS: ${{ secrets.WIKI_BOT_PASS }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Code push detected — regenerating all PDFs"
            python3 wiki_publish.py --force
          else
            python3 wiki_publish.py
          fi
